<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم · Bijouterie Youssra</title>
  <style>
    :root{--pink:#ed1c70;--pink-2:#ff5d9b;--gold:#c9973e;--navy:#202d36;--bg:#f6f7f9;--card:#fff;--ink:#1e252b;--muted:#7c858c;--line:#e9edf0;--good:#23a26d;--warn:#e09b24;--danger:#d64b5c;--shadow:0 18px 45px #26343a12}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif}.hidden{display:none!important}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.authScreen{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 16% 12%,#ffe8f0 0 16%,transparent 35%),linear-gradient(135deg,#fff,#f5f6f8)}.authCard{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:36px;box-shadow:var(--shadow);text-align:center}.brandMark{width:66px;height:66px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),#ff9dbb);color:#fff;font-size:30px;box-shadow:0 12px 24px #ed1c7030}.authCard h1{margin:0 0 8px;font-size:26px}.authCard p{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 24px}.authForm{display:grid;gap:12px;text-align:right}.authForm label,.field label{font-size:12px;color:#5d686f}.authForm input,.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;outline:0;color:var(--ink)}.authForm input:focus,.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ed1c7012}.primary{background:var(--pink);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;box-shadow:0 8px 18px #ed1c7025}.primary:hover{background:#d90f60}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700}.authMessage{min-height:20px;color:var(--danger);font-size:12px}.setupHint{color:var(--gold)!important;font-size:12px!important;margin-top:18px!important}.app{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr);direction:rtl}.sidebar{background:var(--navy);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px;min-height:100vh}.sideBrand{display:flex;align-items:center;gap:11px;padding:3px 8px 22px;border-bottom:1px solid #ffffff1a}.sideBrandMark{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:var(--pink);font-size:19px}.sideBrand strong{font-size:15px}.sideBrand small{display:block;color:#b8c4c9;font-size:10px;margin-top:3px}.sideNav{display:grid;gap:5px}.sideNav button{display:flex;align-items:center;gap:10px;text-align:right;padding:12px 13px;background:transparent;color:#cbd4d8;border-radius:11px;font-size:13px}.sideNav button:hover,.sideNav button.active{background:#ffffff15;color:#fff}.sideNav button.active{box-shadow:inset -3px 0 0 var(--pink)}.sideIcon{width:20px;text-align:center;color:#f5c9d8}.sideBottom{margin-top:auto;display:grid;gap:8px}.sideBottom button,.sideBottom a{display:block;text-align:center;color:#b8c4c9;background:#ffffff0d;border-radius:10px;padding:10px;font-size:12px;text-decoration:none}.sideBottom button:hover,.sideBottom a:hover{background:#ffffff18;color:#fff}.main{min-width:0;padding:26px 34px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.topbar h1{font-size:25px;margin:0}.topbar p{margin:6px 0 0;color:var(--muted);font-size:12px}.topActions{display:flex;align-items:center;gap:8px}.round{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink)}.userPill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:7px 11px;color:var(--muted);font-size:12px}.userDot{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#ffe7ef;color:var(--pink);font-weight:700}.view{animation:rise .35s ease}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.statCard{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 8px 24px #26343a08}.statTop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.statIcon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:#fff0f5;color:var(--pink);font-size:17px}.statCard strong{display:block;font-size:24px;margin-top:17px;direction:ltr;text-align:right}.statCard small{display:block;color:var(--muted);font-size:10px;margin-top:6px}.statCard .up{color:var(--good)}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #26343a08;padding:20px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panelHead h2{font-size:16px;margin:0}.panelHead small{color:var(--muted);font-size:11px}.chart{height:220px;display:flex;align-items:end;gap:12px;padding:16px 6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.barCol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:min(34px,70%);height:var(--h);min-height:7px;background:linear-gradient(180deg,var(--pink-2),var(--pink));border-radius:8px 8px 3px 3px;box-shadow:0 5px 12px #ed1c7025}.barCol span{font-size:10px;color:var(--muted)}.rankList{display:grid;gap:11px}.rank{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;font-size:12px}.rankNo{width:27px;height:27px;border-radius:9px;background:#fff3df;color:var(--gold);display:grid;place-items:center;font-weight:700}.rank b{font-size:12px}.rank small{display:block;color:var(--muted);margin-top:4px;font-size:10px}.rank strong{color:var(--pink);font-size:12px}.notice{display:flex;align-items:center;gap:12px;padding:13px 15px;background:#fff7e7;border:1px solid #f4ddb2;color:#88621d;border-radius:13px;font-size:12px;margin-top:18px}.notice b{font-size:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.toolbarActions{display:flex;gap:8px;flex-wrap:wrap}.search{max-width:300px;background:var(--card)}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:right;padding:14px 10px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}.table th{color:var(--muted);font-weight:600;background:#fbfcfd}.table td strong{font-size:13px}.table tr:last-child td{border-bottom:0}.productCell{display:flex;align-items:center;gap:9px}.productThumb{width:37px;height:37px;border-radius:9px;object-fit:cover;background:#f5e9ec}.pill{display:inline-flex;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:700}.pill.good{background:#e7f7ef;color:#197951}.pill.warn{background:#fff5dd;color:#a56b08}.pill.danger{background:#ffeaee;color:#b9364a}.pill.blue{background:#e9f0ff;color:#406fc6}.actions{display:flex;gap:5px}.iconBtn{width:31px;height:31px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--muted)}.iconBtn:hover{color:var(--pink);border-color:#f5aac2}.formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.formFoot{display:flex;justify-content:flex-start;gap:8px;margin-top:16px}.empty{padding:38px;text-align:center;color:var(--muted);font-size:13px}.reportCards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.reportMetric{padding:17px;border-radius:14px;background:#fff7fa;border:1px solid #f7dce6}.reportMetric small{color:var(--muted);font-size:11px}.reportMetric strong{display:block;color:var(--pink);font-size:22px;margin-top:9px}.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.dangerBtn{background:#fff0f2;color:var(--danger);border:1px solid #f3ccd2;border-radius:12px;padding:10px 14px}.toast{position:fixed;left:28px;bottom:25px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}.dark{--bg:#151b20;--card:#202a31;--ink:#f3f6f7;--muted:#a8b4b9;--line:#34434b}.dark .authScreen{background:#151b20}.dark .authCard,.dark .field input,.dark .field select,.dark .field textarea,.dark .search,.dark .secondary,.dark .round,.dark .iconBtn{background:var(--card);color:var(--ink);border-color:var(--line)}.dark .table th{background:#26333a}.dark .notice{background:#382e1e;border-color:#705a2d;color:#f4d58f}.dark .reportMetric{background:#32242c;border-color:#543746}.dark .userPill{background:var(--card);border-color:var(--line)}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.reportCards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{display:block}.sidebar{min-height:auto;padding:14px;position:sticky;top:0;z-index:10}.sideBrand{border:0;padding-bottom:8px}.sideNav{display:flex;overflow:auto;gap:4px}.sideNav button{white-space:nowrap;padding:9px 11px}.sideBottom{display:none}.main{padding:19px 14px}.topbar h1{font-size:20px}.userPill span{display:none}.cards,.reportCards,.settingsGrid,.formGrid{grid-template-columns:1fr}.statCard strong{font-size:22px}.panel{padding:15px}.authCard{padding:27px 20px}}
  .forgotPin{background:none;color:var(--pink);font-size:12px;margin-top:10px;text-decoration:underline}.forgotPin:hover{color:#b70b54}
  </style>
</head>
<body>
  <section class="authScreen" id="authScreen">
    <div class="authCard">
      <div class="brandMark">♢</div>
      <h1>لوحة Bijouterie Youssra</h1>
      <p id="authIntro">هذه الصفحة خاصة بك. اختاري رمزاً سرياً للدخول إلى لوحة التحكم.</p>
      <form class="authForm" id="setupForm">
        <label>اختاري رمز PIN خاصاً بك<input id="newPin" type="password" inputmode="numeric" minlength="4" required placeholder="4 أرقام أو أكثر"></label>
        <label>أعيدي كتابة الرمز<input id="confirmPin" type="password" inputmode="numeric" minlength="4" required placeholder="تأكيد الرمز"></label>
        <button class="primary" type="submit">حفظ الرمز وفتح اللوحة</button>
      </form>
      <form class="authForm hidden" id="loginForm">
        <label>رمز الدخول<input id="loginPin" type="password" inputmode="numeric" required placeholder="أدخلي الرمز السري"></label>
        <button class="primary" type="submit">دخول آمن</button>
      </form>
      <div class="authMessage" id="authMessage"></div>
      <button class="forgotPin" id="forgotPin" type="button">نسيت الرمز؟ تعيين رمز جديد</button>
      <p class="setupHint">لا تشاركي رمز الدخول مع أي شخص.</p>
    </div>
  </section>

  <div class="app hidden" id="app">
    <aside class="sidebar">
      <div class="sideBrand"><div class="sideBrandMark">♢</div><div><strong>Bijouterie Youssra</strong><small>لوحة الإدارة الخاصة</small></div></div>
      <nav class="sideNav" id="sideNav">
        <button class="active" data-view="overview"><span class="sideIcon">⌂</span>الرئيسية</button>
        <button data-view="products"><span class="sideIcon">◈</span>المنتجات</button>
        <button data-view="orders"><span class="sideIcon">▣</span>الطلبات</button>
        <button data-view="inventory"><span class="sideIcon">◇</span>المخزون</button>
        <button data-view="customers"><span class="sideIcon">♙</span>الزبناء</button>
        <button data-view="expenses"><span class="sideIcon">−</span>المصاريف</button>
        <button data-view="reports"><span class="sideIcon">↗</span>التقارير</button>
        <button data-view="settings"><span class="sideIcon">⚙</span>الإعدادات</button>
      </nav>
      <div class="sideBottom"><a href="index.html">← العودة للمتجر</a><button id="logout">تسجيل الخروج</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><h1 id="pageTitle">الرئيسية</h1><p id="pageSubtitle">نظرة سريعة على أداء متجرك اليوم</p></div><div class="topActions"><button class="round" id="themeToggle" aria-label="تبديل الثيم">☾</button><div class="userPill"><span>المالكة</span><div class="userDot">ي</div></div></div></header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const STORE={products:'youssraAdminProducts',orders:'youssraAdminOrders',expenses:'youssraAdminExpenses',settings:'youssraAdminSettings',pin:'youssraAdminPin'};
    const seedProducts=[
      {id:1,name:'طقم سلاسل هاروير',sku:'Y-001',category:'قلائد',cost:120,price:249,stock:3,added:'2026-09-11'},
      {id:2,name:'سلسلة وسوار كوري',sku:'Y-002',category:'أساور',cost:80,price:169,stock:6,added:'2026-09-11'},
      {id:3,name:'سوار H مضفر',sku:'Y-003',category:'أساور',cost:18,price:40,stock:1,added:'2026-09-11'},
      {id:4,name:'طقم أساور ذهبية مترابطة',sku:'Y-004',category:'نساء',cost:130,price:249,stock:8,added:'2026-09-11'}
    ];
    const seedSettings={store:'Bijouterie Youssra',phone:'+212 629 416 630',currency:'MAD',lowStock:2};
    const $=selector=>document.querySelector(selector);
    const read=(key,fallback)=>{try{const value=localStorage.getItem(key);return value?JSON.parse(value):fallback}catch(error){return fallback}};
    const write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
    const products=()=>read(STORE.products,seedProducts);
    const orders=()=>read(STORE.orders,[]);
    const expenses=()=>read(STORE.expenses,[]);
    const settings=()=>({...seedSettings,...read(STORE.settings,{})});
    if(!localStorage.getItem(STORE.products))write(STORE.products,seedProducts);
    if(!localStorage.getItem(STORE.orders))write(STORE.orders,[]);
    if(!localStorage.getItem(STORE.expenses))write(STORE.expenses,[]);
    if(!localStorage.getItem(STORE.settings))write(STORE.settings,seedSettings);
    const money=value=>new Intl.NumberFormat('fr-MA',{maximumFractionDigits:0}).format(Number(value||0))+' DH';
    const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const dateNow=()=>new Date().toISOString().slice(0,10);
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
    async function pinHash(value){if(window.crypto?.subtle){const data=new TextEncoder().encode(value),buffer=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buffer)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(unescape(encodeURIComponent(value)))}
    const authScreen=$('#authScreen'),app=$('#app'),setupForm=$('#setupForm'),loginForm=$('#loginForm'),authIntro=$('#authIntro'),authMessage=$('#authMessage');
    function showAuth(){authScreen.classList.remove('hidden');app.classList.add('hidden');const hasPin=Boolean(localStorage.getItem(STORE.pin));setupForm.classList.toggle('hidden',hasPin);loginForm.classList.toggle('hidden',!hasPin);authIntro.textContent=hasPin?'أدخلي الرمز السري باش تفتحي لوحة التحكم الخاصة بك.':'هذه الصفحة خاصة بك. اختاري رمزاً سرياً للدخول إلى لوحة التحكم.'}
    function openApp(){sessionStorage.setItem('youssraAdminSession','1');authScreen.classList.add('hidden');app.classList.remove('hidden');renderView('overview')}
    setupForm.onsubmit=async event=>{event.preventDefault();const pin=$('#newPin').value,confirm=$('#confirmPin').value;if(pin.length<4||pin!==confirm){authMessage.textContent='تأكدي من الرمز وأنه مكوّن من 4 أرقام على الأقل.';return}localStorage.setItem(STORE.pin,await pinHash(pin));authMessage.textContent='تم حفظ الرمز بنجاح.';openApp()};
    loginForm.onsubmit=async event=>{event.preventDefault();const valid=await pinHash($('#loginPin').value)===localStorage.getItem(STORE.pin);if(!valid){authMessage.textContent='الرمز غير صحيح.';return}authMessage.textContent='';openApp()};
    $('#forgotPin').onclick=()=>{if(confirm('غادي يتحيد غير PIN المحلي، والمنتجات والطلبات غادي يبقاو محفوظين. واش متأكدة؟')){localStorage.removeItem(STORE.pin);sessionStorage.removeItem('youssraAdminSession');authMessage.textContent='اختاري PIN جديد من فضلك.';showAuth()}};
    $('#logout').onclick=()=>{sessionStorage.removeItem('youssraAdminSession');showAuth()};
    $('#themeToggle').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('youssraAdminTheme',document.body.classList.contains('dark')?'dark':'light')};
    if(localStorage.getItem('youssraAdminTheme')==='dark')document.body.classList.add('dark');
    const pageInfo={overview:['الرئيسية','نظرة سريعة على أداء متجرك اليوم'],products:['المنتجات','إضافة وتعديل وتتبع المنتجات'],orders:['الطلبات','تتبعي كل الطلبات وحالاتها'],inventory:['المخزون','راقبي الكميات والمنتجات القريبة من النفاد'],customers:['الزبناء','نظرة على الزبناء والطلبات'],expenses:['المصاريف والأرباح','سجلي المصاريف واحسبي الربح الصافي'],reports:['التقارير','حللي المبيعات والأرباح'],settings:['الإعدادات','معلومات المتجر وإعداداته']};
    $('#sideNav').addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(!button)return;renderView(button.dataset.view)});
    function selectNav(view){document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));$('#pageTitle').textContent=pageInfo[view][0];$('#pageSubtitle').textContent=pageInfo[view][1]}
    function calc(){const ps=products(),os=orders(),es=expenses(),sales=os.filter(o=>o.status==='تم التسليم'||o.status==='تم التأكيد'||o.status==='تم الشحن').reduce((s,o)=>s+Number(o.total||0),0),cost=os.reduce((s,o)=>s+Number(o.cost||0),0),spent=es.reduce((s,e)=>s+Number(e.amount||0),0);return{ps,os,es,sales,cost,spent,profit:sales-cost-spent,stockValue:ps.reduce((s,p)=>s+p.cost*p.stock,0),low:ps.filter(p=>p.stock<=Number(settings().lowStock))}}
    function statCard(label,value,icon,note,klass=''){return '<article class="statCard"><div class="statTop"><span>'+label+'</span><div class="statIcon">'+icon+'</div></div><strong class="'+klass+'">'+value+'</strong><small>'+note+'</small></article>'}
    function renderOverview(){const c=calc(),days=['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد'],bars=[35,55,43,78,64,92,70];return '<section class="cards">'+statCard('مداخيل اليوم',money(c.sales/7),'◷','تحديث تلقائي')+statCard('مداخيل الشهر',money(c.sales),'▣','من الطلبات المسجلة')+statCard('الأرباح الصافية',money(c.profit),'↗','بعد خصم المصاريف','up')+statCard('عدد الطلبات',c.os.length,'▤','جميع الحالات')+statCard('قيمة المخزون',money(c.stockValue),'◇','بسعر الشراء')+statCard('منتجات قربات تسالي',c.low.length,'!','تحتاج للمراجعة','')+statCard('عدد الزبناء',new Set(c.os.map(o=>o.phone).filter(Boolean)).size,'♙','زبناء مسجلون')+statCard('مصاريف الشهر',money(c.spent),'−','التغليف والإعلانات وغيرها')+'</section><div class="grid2"><section class="panel"><div class="panelHead"><div><h2>المبيعات حسب الأيام</h2><small>آخر 7 أيام</small></div><span class="pill blue">MAD</span></div><div class="chart">'+bars.map((height,i)=>'<div class="barCol"><div class="bar" style="--h:'+height+'%"></div><span>'+days[i].slice(0,3)+'</span></div>').join('')+'</div></section><section class="panel"><div class="panelHead"><div><h2>أكثر المنتجات مبيعاً</h2><small>حسب الطلبات المسجلة</small></div></div><div class="rankList">'+c.ps.slice(0,4).map((p,i)=>'<div class="rank"><div class="rankNo">'+(i+1)+'</div><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+' · مخزون '+p.stock+'</small></div><strong>'+money(p.price)+'</strong></div>').join('')+'</div></section></div>'+(c.low.length?'<div class="notice"><b>⚠</b><span>كاينين <strong>'+c.low.length+'</strong> منتجات وصل المخزون ديالها للحد الأدنى أو أقل.</span></div>':'')}

ice" type="number" min="0" required></label></div><div class="field"><label>الكمية<input name="stock" type="number" min="0" required></label></div></div><div class="formFoot"><button class="primary" type="submit">حفظ المنتج</button><button class="secondary" type="button" id="cancelProduct">إلغاء</button></div></form></section>'}

    function renderExpenses(){const es=expenses(),total=es.reduce((s,e)=>s+Number(e.amount||0),0);return '<div class="reportCards"><div class="reportMetric"><small>مجموع المصاريف</small><strong>'+money(total)+'</strong></div><div class="reportMetric"><small>شراء المنتجات</small><strong>'+money(es.filter(e=>e.category==='شراء المنتجات').reduce((s,e)=>s+Number(e.amount||0),0))+'</strong></div><div class="reportMetric"><small>الإعلانات</small><strong>'+money(es.filter(e=>e.category==='الإعلانات').reduce((s,e)=>s+Number(e.amount||0),0))+'</strong></div><div class="reportMetric"><small>مصاريف أخرى</small><strong>'+money(es.filter(e=>e.category==='أخرى').reduce((s,e)=>s+Number(e.amount||0),0))+'</strong></div></div><section class="panel"><div class="panelHead"><h2>تسجيل مصروف</h2></div><form id="expenseForm"><div class="formGrid"><div class="field"><label>النوع<select name="category"><option>شراء المنتجات</option><option>التغليف</option><option>التوصيل</option><option>الإعلانات</option><option>أخرى</option></select></label></div><div class="field"><label>المبلغ<input name="amount" type="number" min="0" required></label></div><div class="field"><label>التاريخ<input name="date" type="date" value="'+dateNow()+'" required></label></div><div class="field full"><label>ملاحظة<textarea name="note" rows="2" placeholder="مثال: كراتين وتغليف الطلبات"></textarea></label></div></div><div class="formFoot"><button class="primary">حفظ المصروف</button></div></form></section><section class="panel" style="margin-top:18px"><div class="panelHead"><h2>المصاريف المسجلة</h2></div><div class="tableWrap"><table class="table"><thead><tr><th>النوع</th><th>المبلغ</th><th>التاريخ</th><th>الملاحظة</th><th></th></tr></thead><tbody>'+ (es.length?es.map(e=>'<tr><td>'+esc(e.category)+'</td><td>'+money(e.amount)+'</td><td>'+esc(e.date)+'</td><td>'+esc(e.note||'—')+'</td><td><button class="iconBtn" data-expense="'+e.id+'">×</button></td></tr>').join(''):'<tr><td colspan="5"><div class="empty">مازال ما تسجل ح     function renderSettings(){const s=settings();return '<section class="panel"><div class="panelHead"><h2>معلومات المتجر</h2></div><form id="settingsForm"><div class="formGrid"><div class="field"><label>اسم المتجر<input name="store" value="'+esc(s.store)+'"></label></div><div class="field"><label>رقم واتساب<input name="phone" value="'+esc(s.phone)+'"></label></div><div class="field"><label>العملة<select name="currency"><option '+(s.currency==='MAD'?'selected':'')+'>MAD</option><option>EUR</option></select></label></div><div class="field"><label>تنبيه المخزون تحت<input name="lowStock" type="number" min="0" value="'+s.lowStock+'"></label></div></div><div class="formFoot"><button class="primary">حفظ الإعدادات</button></div></form></section><section class="panel" style="margin-top:18px"><div class="panelHead"><h2>الحساب</h2></div><p style="color:var(--muted);font-size:13px;line-height:1.8">لوحة التحكم محمية برمز PIN خاص بك. إذا بغيتي تبدليه، استعملي الزر التالي.</p><button class="dangerBtn" id="resetPin">تغيير رمز الدخول</button></section>'}

      const deliverySettings=()=>({...deliveryDefaults,...read('youssraDeliveryRates',{})});
      const originalRenderSettings=renderSettings;
      renderSettings=function(){const s=siteSettings(),d=deliverySettings(),codes=read('youssraPromoCodes',{YOUS10:{percent:10},WELCOME:{percent:5}});return originalRenderSettings()+'<section class="panel" style="margin-top:18px"><div class="panelHead"><div><h2>التحكم في واجهة الموقع</h2><small>التغييرات غادي تبان فالمتجر بعد التحديث</small></div></div><form id="siteControlForm"><div class="formGrid"><div class="field"><label>الخلفية<select name="background"><option value="light" '+(s.background==='light'?'selected':'')+'>فاتحة</option><option value="dark" '+(s.background==='dark'?'selected':'')+'>داكنة</option></select></label></div><div class="field"><label>رقم واتساب<input name="whatsapp" value="'+esc(s.whatsapp)+'"></label></div><div class="field"><label>Instagram<input name="instagram" value="'+esc(s.instagram)+'"></label></div><div class="field"><label>Facebook<input name="facebook" value="'+esc(s.facebook)+'"></label></div><div class="field full"><label>النص التعريفي في الواجهة<input name="heroText" value="'+esc(s.heroText)+'"></label></div></div><div class="formFoot"><button class="primary" type="submit">حفظ تغييرات الموقع</button></div></form></section><section class="panel" style="margin-top:18px"><div class="panelHead"><div><h2>التوصيل حسب المدينة</h2><small>عدّلي الثمن والمدة بلا تعديل الكود</small></div></div><form id="deliveryControlForm"><div class="formGrid">'+Object.entries(d).map(([city,value])=>'<div class="field"><label>'+esc(city)+' — الثمن<input name="'+esc(city)+'_fee" type="number" min="0" value="'+Number(value.fee||0)+'"></label><label>المدة<input name="'+esc(city)+'_days" value="'+esc(value.days||'')+'"></label></div>').join('')+'</div><div class="formFoot"><button class="primary" type="submit">حفظ التوصيل</button></div></form></section><section class="panel" style="margin-top:18px"><div class="panelHead"><div><h2>أكواد التخفيض</h2><small>أضيفي كودًا ونسبة التخفيض</small></div></div><form id="promoControlForm"><div class="formGrid"><div class="field"><label>الكود<input name="code" required placeholder="مثال: YOUS10"></label></div><div class="field"><label>نسبة التخفيض %<input name="percent" type="number" min="0" max="100" required></label></div></div><div class="formFoot"><button class="primary" type="submit">إضافة الكود</button></div></form><div class="tableWrap" style="margin-top:14px"><table class="table"><thead><tr><th>الكود</th><th>التخفيض</th><th>إجراء</th></tr></thead><tbody>'+Object.entries(codes).map(([code,value])=>'<tr><td><strong>'+esc(code)+'</strong></td><td>'+Number(value.percent||0)+'%</td><td><button class="iconBtn" data-remove-promo="'+esc(code)+'">×</button></td></tr>').join('')+'</tbody></table></div></section>'};
      const originalBindSettings=bindSettings;
      bindSettings=function(){originalBindSettings();const siteForm=$('#siteControlForm'),deliveryForm=$('#deliveryControlForm'),promoForm=$('#promoControlForm');if(siteForm)siteForm.onsubmit=e=>{e.preventDefault();write('youssraSiteSettings',Object.fromEntries(new FormData(siteForm).entries()));toast('تم حفظ إعدادات الموقع');};if(deliveryForm)deliveryForm.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(deliveryForm).entries()),next={};Object.keys(deliveryDefaults).forEach(city=>next[city]={fee:Number(data[city+'_fee']||0),days:data[city+'_days']||''});write('youssraDeliveryRates',next);toast('تم حفظ معلومات التوصيل');};if(promoForm)promoForm.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(promoForm).entries()),codes=read('youssraPromoCodes',{YOUS10:{percent:10},WELCOME:{percent:5}});codes[String(data.code||'').trim().toUpperCase()]={percent:Number(data.percent||0)};write('youssraPromoCodes',codes);toast('تم حفظ كود التخفيض');renderView('settings')};document.querySelectorAll('[data-remove-promo]').forEach(button=>button.onclick=()=>{const codes=read('youssraPromoCodes',{YOUS10:{percent:10},WELCOME:{percent:5}});delete codes[button.dataset.removePromo];write('youssraPromoCodes',codes);renderView('settings')})};
    })();
  </script>
  <script>
    (function(){
      const promotionDefaults={enabled:false,title:'✨ عرض خاص',giftText:'استفيدي من العرض الآن',oldPrice:'',price:'',endsAt:''};
      const loyaltyDefaults={enabled:true,target:5,gift:'هدية مجانية'};
      const baseRenderSettings=renderSettings;
      renderSettings=function(){let p={...promotionDefaults,...read('youssraPromotion',{})},l={...loyaltyDefaults,...read('youssraLoyaltySettings',{})};return baseRenderSettings()+'<section class="panel" style="margin-top:18px"><div class="panelHead"><div><h2>العرض الخاص والعداد</h2><small>العرض يبان تلقائيا فصفحة العروض</small></div></div><form id="promotionControlForm"><div class="formGrid"><div class="field"><label>تشغيل العرض<select name="enabled"><option value="false" '+(!p.enabled?'selected':'')+'>متوقف</option><option value="true" '+(p.enabled?'selected':'')+'>مشتغل</option></select></label></div><div class="field"><label>عنوان العرض<input name="title" value="'+esc(p.title)+'"></label></div><div class="field"><label>الثمن القديم<input name="oldPrice" type="number" min="0" value="'+esc(p.oldPrice)+'"></label></div><div class="field"><label>الثمن الجديد<input name="price" type="number" min="0" value="'+esc(p.price)+'"></label></div><div class="field"><label>تاريخ ووقت النهاية<input name="endsAt" type="datetime-local" value="'+(p.endsAt?new Date(Number(p.endsAt)).toISOString().slice(0,16):'')+'"></label></div><div class="field full"><label>نص العرض<input name="giftText" value="'+esc(p.giftText)+'"></label></div></div><div class="formFoot"><button class="primary" type="submit">حفظ العرض</button></div></form></section><section class="panel" style="margin-top:18px"><div class="panelHead"><div><h2>برنامج الوفاء</h2><small>تتبعي عدد الطلبات والهدية</small></div></div><form id="loyaltyControlForm"><div class="formGrid"><div class="field"><label>الحالة<select name="enabled"><option value="false" '+(!l.enabled?'selected':'')+'>متوقف</option><option value="true" '+(l.enabled?'selected':'')+'>مشتغل</option></select></label></div><div class="field"><label>عدد الطلبات المطلوبة<input name="target" type="number" min="1" value="'+Number(l.target||5)+'"></label></div><div class="field"><label>الهدية<input name="gift" value="'+esc(l.gift)+'"></label></div></div><div class="formFoot"><button class="primary" type="submit">حفظ برنامج الوفاء</button></div></form></section>'};
      const baseBindSettings=bindSettings;
      bindSettings=function(){baseBindSettings();const promo=$('#promotionControlForm'),loyalty=$('#loyaltyControlForm');if(promo)promo.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(promo).entries());write('youssraPromotion',{enabled:d.enabled==='true',title:d.title,giftText:d.giftText,oldPrice:Number(d.oldPrice||0),price:Number(d.price||0),endsAt:d.endsAt?new Date(d.endsAt).getTime():0});toast('تم حفظ العرض');};if(loyalty)loyalty.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(loyalty).entries());write('youssraLoyaltySettings',{enabled:d.enabled==='true',target:Number(d.target||5),gift:d.gift});toast('تم حفظ برنامج الوفاء');}};
    })();
  </script>
</body>
